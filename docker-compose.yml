services:
  ocs2api:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      OCS2API_DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
