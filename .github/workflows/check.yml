name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate publication files
        run: python scripts/check_release.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Build Windows executable
        shell: pwsh
        run: ./build_exe.ps1 -SkipInstall
      - name: Smoke test isolated executable
        run: python scripts/smoke_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: OCS2API-windows-x64
          path: dist/OCS2API.exe
          if-no-files-found: error
